<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020;color:#eaf0ff;font-family:system-ui,sans-serif;touch-action:manipulation}h1{font-size:20px;margin:8px}button{background:#4f7cff;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:16px;margin:6px}#s{margin:6px;opacity:.85}canvas{background:#111a33;border-radius:12px;max-width:94vw}.p{display:grid;grid-template-columns:repeat(3,64px);gap:6px}.p button{padding:16px 0;margin:0}</style></head><body>
<h1>Snake</h1><div id="s">Score: 0</div><canvas id="c" width="320" height="320"></canvas>
<div class="p"><span></span><button data-d="U">&#9650;</button><span></span><button data-d="L">&#9664;</button><button data-d="D">&#9660;</button><button data-d="R">&#9654;</button></div>
<button id="r">Restart</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=16,S=20;let sn,d,f,sc,t,over;
const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function init(){sn=[[8,8],[7,8],[6,8]];d='R';sc=0;over=false;place();clearInterval(t);t=setInterval(step,130);draw()}
function place(){do{f=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(sn.some(p=>p[0]==f[0]&&p[1]==f[1]))}
function turn(n){const o={U:'D',D:'U',L:'R',R:'L'};if(o[n]!=d)d=n}
function step(){const v=V[d],h=[sn[0][0]+v[0],sn[0][1]+v[1]];
if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]==h[0]&&p[1]==h[1])){over=true;clearInterval(t);draw();return}
sn.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;place()}else sn.pop();draw()}
function draw(){x.fillStyle='#111a33';x.fillRect(0,0,320,320);x.fillStyle='#ff5470';x.fillRect(f[0]*S,f[1]*S,S-2,S-2);
x.fillStyle='#3ddc97';sn.forEach(p=>x.fillRect(p[0]*S,p[1]*S,S-2,S-2));
document.getElementById('s').textContent=over?'Game over - score '+sc:'Score: '+sc}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));
addEventListener('keydown',e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m){turn(m);e.preventDefault()}});
document.getElementById('r').onclick=init;init();
</script></body></html>
